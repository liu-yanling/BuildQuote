services:
  buildquote:
    build: .
    image: buildquote:latest
    container_name: buildquote
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      PORT: "8010"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
